version: 2
updates:
  # Keep GitHub Actions (including the CI and docker workflows) up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies (setup.py).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
