[pytest]
# The `e2e` marker gates the slow docker-based suite so it never runs as part of
# the normal unit-test run. Run it explicitly with:  pytest e2e -m e2e
markers =
    e2e: full docker-based end-to-end test (slow; spins up Redmine + GitLab)

# Keep the default collection to the fast unit tests only.
testpaths = redmine_gitlab_migrator/tests
