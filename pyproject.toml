[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redmine-gitlab-migrator"
version = "1.0.3"
description = "Migrate a redmine project to gitlab"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Jocelyn Delalande", email = "jdelalande@oasiswork.fr" },
    { name = "Benjamin Schmitz", email = "benjamin.schmitz@tum.de" },
]
dependencies = [
    "pyyaml>=5.1",
    "requests>=2.20",
    "GitPython>=3.0",
    "pypandoc>=1.5",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/redmine-gitlab-migrator/redmine-gitlab-migrator"

[project.scripts]
migrate-rg = "redmine_gitlab_migrator.commands:main"

[tool.setuptools]
packages = ["redmine_gitlab_migrator"]
